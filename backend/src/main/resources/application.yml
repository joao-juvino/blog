spring:
  application.name: juvino-tech-api
  profiles.active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DATABASE_USERNAME:blog}
    password: ${DATABASE_PASSWORD:blog}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 5MB
    max-request-size: 5MB
server:
  port: ${PORT:8080}
  error.include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-development-key-is-32-bytes}
    expiration: ${JWT_EXPIRATION_MS:3600000}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:blog-images}
  admin:
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
management.endpoints.web.exposure.include: health
